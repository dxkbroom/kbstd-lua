[package]
name = "luastd_runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Embedding runtime for luastd: permission-checked effect modules and structured async."
readme = "../../README.md"
repository.workspace = true
license.workspace = true

[dependencies]
luastd = { workspace = true }
mlua = { workspace = true }

[features]
# No default Lua version and no `vendored`: the host picks (AGENTS.md). These
# only forward to mlua so the crate can be tested on its own.
lua52 = ["luastd/lua52", "mlua/lua52"]
lua53 = ["luastd/lua53", "mlua/lua53"]
lua54 = ["luastd/lua54", "mlua/lua54"]
lua55 = ["luastd/lua55", "mlua/lua55"]
luajit = ["luastd/luajit", "mlua/luajit"]
luajit52 = ["luastd/luajit52", "mlua/luajit52"]
vendored = ["luastd/vendored", "mlua/vendored"]

[lints]
workspace = true
