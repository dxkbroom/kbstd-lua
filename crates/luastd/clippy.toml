# luastd holds pure modules only (the floor): no filesystem, environment or
# process access. Effect modules live in luastd_runtime behind permissions.
disallowed-methods = [
  { path = "std::fs::canonicalize", reason = "pure modules do no IO" },
  { path = "std::fs::copy", reason = "pure modules do no IO" },
  { path = "std::fs::create_dir", reason = "pure modules do no IO" },
  { path = "std::fs::create_dir_all", reason = "pure modules do no IO" },
  { path = "std::fs::exists", reason = "pure modules do no IO" },
  { path = "std::fs::hard_link", reason = "pure modules do no IO" },
  { path = "std::fs::metadata", reason = "pure modules do no IO" },
  { path = "std::fs::read", reason = "pure modules do no IO" },
  { path = "std::fs::read_dir", reason = "pure modules do no IO" },
  { path = "std::fs::read_link", reason = "pure modules do no IO" },
  { path = "std::fs::read_to_string", reason = "pure modules do no IO" },
  { path = "std::fs::remove_dir", reason = "pure modules do no IO" },
  { path = "std::fs::remove_dir_all", reason = "pure modules do no IO" },
  { path = "std::fs::remove_file", reason = "pure modules do no IO" },
  { path = "std::fs::rename", reason = "pure modules do no IO" },
  { path = "std::fs::set_permissions", reason = "pure modules do no IO" },
  { path = "std::fs::symlink_metadata", reason = "pure modules do no IO" },
  { path = "std::fs::write", reason = "pure modules do no IO" },
  { path = "std::path::Path::canonicalize", reason = "pure modules do no IO" },
  { path = "std::path::Path::exists", reason = "pure modules do no IO" },
  { path = "std::path::Path::is_dir", reason = "pure modules do no IO" },
  { path = "std::path::Path::is_file", reason = "pure modules do no IO" },
  { path = "std::path::Path::is_symlink", reason = "pure modules do no IO" },
  { path = "std::path::Path::metadata", reason = "pure modules do no IO" },
  { path = "std::path::Path::read_dir", reason = "pure modules do no IO" },
  { path = "std::path::Path::read_link", reason = "pure modules do no IO" },
  { path = "std::path::Path::symlink_metadata", reason = "pure modules do no IO" },
  { path = "std::path::Path::try_exists", reason = "pure modules do no IO" },
  { path = "camino::Utf8Path::canonicalize", reason = "pure modules do no IO" },
