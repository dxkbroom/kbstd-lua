  { path = "camino::Utf8Path::metadata", reason = "pure modules do no IO" },
  { path = "camino::Utf8Path::read_dir", reason = "pure modules do no IO" },
  { path = "camino::Utf8Path::read_dir_utf8", reason = "pure modules do no IO" },
  { path = "camino::Utf8Path::read_link", reason = "pure modules do no IO" },
  { path = "camino::Utf8Path::read_link_utf8", reason = "pure modules do no IO" },
