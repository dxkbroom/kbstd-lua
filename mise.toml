[tools]
"github:lumen-oss/lux" = { version = "latest", bin = "lx" }
rumdl = "0.2.79"
tombi = "1.9.8"
rust = "1.99.0"

[env]
# TODO: temporary local build of fork branch feat/builtin-busted while we keep
# modifying it. Move to a remote source later, e.g. the mise `cargo:` backend
# from https://github.com/dxkbroom/emmylua-analyzer-rust (branch or tag), or
# fork releases via `github:dxkbroom/emmylua-analyzer-rust`.
# Refresh the binaries with `mise run fork:build`.
_.path = [
  "{{config_root}}/../emmylua-analyzer-rust/target/release",
  "./target/debug",
]
FPATH = "./completions:{{env.FPATH | default(value='')}}"
# fish_complete_path = "./completions:{{env.fish_complete_path | default(value='')}}"

[task_config]
includes = ["tasks.toml", "xtasks/tasks"]
